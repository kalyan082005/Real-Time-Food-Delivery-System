spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret: test-secret-key-for-testing-purposes-only-min-256-bits-long
  expiration: 86400000

stripe:
  secret-key: sk_test_dummy_key_for_testing
  publishable-key: pk_test_dummy_key_for_testing
  webhook-secret: whsec_dummy_webhook_secret_for_testing
